<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lens Siren X</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header class="header">
        <h1>Lens Siren X</h1>
    </header>
    <main class="dashboard">
        <!-- Video Feed -->
        <section class="video-feed">
            <div class="card" id="video-feed-container">
                <img id="video-feed" class="card-img" alt="Live camera feed">
                <div class="card-content">
                    <button id="fullscreen-toggle" class="btn btn-primary">Full Screen</button>
                </div>
            </div>
        </section>

        <!-- Scene Count (Snapshots) -->
        <section class="scene-count">
            <div class="card">
                <div class="card-content">
                    <h2>Snapshots</h2>
                    <p class="snapshot-count-large" id="snapshot-count">0</p>
                    <p class="snapshot-info">Total Snapshots</p>
                    <div id="snapshot-list" class="list-unstyled scrollable"></div>
                    <button id="load-more" class="btn btn-primary hidden">Load More</button>
                    <button id="clear-snapshots" class="btn btn-danger">Clear Snapshots</button>
                </div>
            </div>
        </section>

        <!-- Detections -->
        <section class="detections">
            <div class="card">
                <div class="card-content">
                    <h2>Detections</h2>
                    <div id="detection-insights-box" class="box">
                        <h5>Detection Insights</h5>
                        <div id="detection-insights"></div>
                    </div>
                    <div class="box">
                        <h5>Last 5 Detections</h5>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th class="label-small-font">Label</th>
                                    <th>Confidence</th>
                                    <th>Priority</th>
                                </tr>
                            </thead>
                            <tbody id="detections-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- Logs -->
        <section class="logs">
            <div class="card">
                <div class="card-content">
                    <h2>Logs</h2>
                    <ul id="log-list" class="list-unstyled scrollable"></ul>
                </div>
            </div>
        </section>

        <!-- Tools (Diagnostics and Time-Lapse) -->
        <section class="tools">
            <div class="card">
                <div class="card-content">
                    <h2>Tools</h2>
                    <div class="form-group">
                        <button id="diagnostics-btn" class="btn btn-info" data-bs-toggle="tooltip" title="Run system diagnostics to check Kinect and model status">Run Diagnostics</button>
                    </div>
                    <div id="diagnostics" class="list-unstyled scrollable"></div>
                    <h5>Time-Lapse</h5>
                    <div class="form-group">
                        <label for="timelapse-interval">Interval (seconds):</label>
                        <input type="number" id="timelapse-interval" class="form-control" min="1" value="60" data-bs-toggle="tooltip" title="Time between each snapshot in seconds">
                    </div>
                    <div class="form-group">
                        <label for="timelapse-num-images">Images:</label>
                        <input type="number" id="timelapse-num-images" class="form-control" min="1" value="10" data-bs-toggle="tooltip" title="Number of snapshots to capture">
                    </div>
                    <div class="form-group">
                        <label for="video-mode">Mode:</label>
                        <select id="video-mode" class="form-control" data-bs-toggle="tooltip" title="Choose RGB for color video or Depth for depth map">
                            <option value="rgb">RGB</option>
                            <option value="depth">Depth</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="colormap">Colormap:</label>
                        <select id="colormap" class="form-control" data-bs-toggle="tooltip" title="Color scheme for depth mode visualization">
                            <option value="JET">Jet</option>
                            <option value="HOT">Hot</option>
                            <option value="RAINBOW">Rainbow</option>
                            <option value="BONE">Bone</option>
                            <option value="NONE">None</option>
                        </select>
                    </div>
                    <div class="form-group button-group">
                        <button id="start-timelapse-btn" class="btn btn-primary" data-bs-toggle="tooltip" title="Start capturing time-lapse snapshots">Start Time-Lapse</button>
                        <button id="stop-timelapse-btn" class="btn btn-danger" data-bs-toggle="tooltip" title="Stop the active time-lapse">Stop Time-Lapse</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Camera Parameters -->
        <section class="camera-params">
            <div class="card">
                <div class="card-content">
                    <h2>Camera Settings</h2>
                    <form id="camera-params-form">
                        <div class="form-group">
                            <label for="resolution">Resolution:</label>
                            <select id="resolution" class="form-control" data-bs-toggle="tooltip" title="Select camera resolution">
                                <option value="320x240">320x240 (QVGA)</option>
                                <option value="640x480" selected>640x480 (VGA)</option>
                                <option value="1280x720">1280x720 (HD)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="fps">FPS:</label>
                            <input type="number" id="fps" class="form-control" min="1" max="60" value="30" data-bs-toggle="tooltip" title="Frames per second for video feed">
                        </div>
                        <div class="form-check">
                            <input type="checkbox" id="depth-object-detection" class="form-check-input" checked data-bs-toggle="tooltip" title="Enable object detection in depth mode">
                            <label for="depth-object-detection" class="form-check-label">Depth Detection</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" id="tracking-enabled" class="form-check-input" checked data-bs-toggle="tooltip" title="Enable object tracking with DeepSort">
                            <label for="tracking-enabled" class="form-check-label">Tracking</label>
                        </div>
                        <div class="form-group">
                            <label for="motion_threshold">Motion Threshold:</label>
                            <input type="number" id="motion_threshold" class="form-control" min="0" max="255" value="25" data-bs-toggle="tooltip" title="Sensitivity for motion detection (0-255)">
                        </div>
                        <div class="form-group">
                            <label for="min_motion_area">Min Motion Area:</label>
                            <input type="number" id="min_motion_area" class="form-control" min="100" value="500" data-bs-toggle="tooltip" title="Minimum area (pixels) for motion detection">
                        </div>
                        <div class="form-group">
                            <label for="tilt-angle">Tilt Angle (-31 to 31):</label>
                            <input type="number" id="tilt-angle" class="form-control" min="-31" max="31" step="0.1" value="0" data-bs-toggle="tooltip" title="Adjust Kinect tilt angle in degrees">
                            <p>Current Tilt: <span id="current-tilt-angle">N/A</span>°</p>
                        </div>
                        <button type="submit" class="btn btn-primary" data-bs-toggle="tooltip" title="Apply camera settings">Save Settings</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Snapshot Preview Modal -->
    <div class="modal modal-fullscreen fade" id="snapshot-modal" tabindex="-1" aria-labelledby="snapshotModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="snapshotModalLabel">Snapshot Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img id="snapshot-preview" alt="Snapshot preview">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/routing.js" type="module"></script>
    <script src="/static/js/datadetection.js" type="module"></script>
    <script src="/static/js/scripts.js" type="module"></script>
</body>
</html>
