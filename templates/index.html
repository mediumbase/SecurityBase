<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="header">
        <div class="container-fluid">
            <h1 class="float-start">SecuritySiren</h1>
        </div>
    </header>

    <main class="dashboard">
        <section class="video-feed">
            <h2></h2>
            <div class="card" id="video-feed-container">
                <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Live Camera Feed" class="card-img">
                <div class="card-content">
                    <div class="card-header">
                        <h5>Camera Metadata</h5>
                        <button id="fullscreen-toggle" class="app-btn btn-outline">Full Screen</button>
                    </div>
                    <ul id="metadata-list" class="list-unstyled">
                        <li>Resolution: <span id="meta-resolution">N/A</span></li>
                        <li>Timestamp: <span id="meta-timestamp">N/A</span></li>
                        <li>Frame Rate: <span id="meta-fps">N/A</span></li>
                    </ul>
                </div>
            </div>
        </section>

        <section class="scene-count">
            <h2>Scene Count</h2>
            <div class="card">
                <div class="card-content">
                    <div class="snapshot-info">
                        <span id="snapshot-count" class="snapshot-count-large">0</span>
                        <p>Total Snapshots</p>
                        <button id="clear-snapshots" class="app-btn btn-danger btn-sm">Delete All</button>
                    </div>
                    <ul id="snapshot-list" class="list-unstyled scrollable"></ul>
                    <button id="load-more" class="app-btn btn-primary">Load More</button>
                </div>
            </div>
        </section>

        <section class="logs">
            <h2>Logs</h2>
            <div class="card">
                <div class="card-content scrollable">
                    <ul id="log-list" class="list-unstyled"></ul>
                </div>
            </div>
        </section>

        <section class="camera-params">
            <h2>Camera Parameters</h2>
            <div class="card">
                <div class="card-content">
                    <form id="camera-params-form">
                        <!-- Resolution dropdown with common camera resolutions; use 640x480 for best compatibility, 1920x1080 may increase heat -->
                        <div class="form-group">
                            <label for="resolution">Resolution (Min: 320x240, Max: 1920x1080):</label>
                            <select id="resolution" name="resolution" class="form-control form-control-sm">
                                <option value="320x240">320x240 (Low, minimal heat)</option>
                                <option value="640x480" selected>640x480 (Default, balanced)</option>
                                <option value="1280x720">1280x720 (HD, moderate heat)</option>
                                <option value="1920x1080">1920x1080 (Full HD, high heat)</option>
                            </select>
                        </div>
                        <!-- FPS: Higher values increase CPU usage and heat; 30 is optimal for most cases -->
                        <div class="form-group">
                            <label for="fps">FPS (Min: 1, Max: 60):</label>
                            <input type="number" id="fps" name="fps" value="30" min="1" max="60" class="form-control form-control-sm">
                        </div>
                        <!-- Motion Threshold: Higher values reduce false positives but may miss subtle motion -->
                        <div class="form-group">
                            <label for="motion_threshold">Motion Threshold (Higher values reduce false positives):</label>
                            <input type="number" id="motion_threshold" name="motion_threshold" value="25" min="1" class="form-control form-control-sm">
                        </div>
                        <!-- Min Motion Area: Larger values ignore small objects, reducing noise -->
                        <div class="form-group">
                            <label for="min_motion_area">Min Motion Area (Larger values ignore small objects):</label>
                            <input type="number" id="min_motion_area" name="min_motion_area" value="500" min="1" class="form-control form-control-sm">
                        </div>
                        <button type="submit" class="app-btn btn-primary btn-sm">Update</button>
                    </form>
                </div>
            </div>
        </section>

        <section class="camera-controls">
            <h2>Camera Controls</h2>
            <div class="card">
                <div class="card-content scrollable">
                    <form id="camera-controls-form">
                        <div id="controls-loading" class="text-muted">Loading controls...</div>
                    </form>
                </div>
            </div>
        </section>

        <section class="tools">
            <h2>Tools</h2>
            <div class="card">
                <div class="card-content">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="timelapse-toggle" name="timelapse-toggle">
                        <label class="form-check-label" for="timelapse-toggle">Enable Time-Lapse</label>
                    </div>
                    <div id="timelapse-settings" class="hidden">
                        <!-- Interval: Time between snapshots in seconds -->
                        <div class="form-group">
                            <label for="interval">Interval (s):</label>
                            <input type="number" id="interval" name="interval" value="60" min="1" class="form-control form-control-sm">
                        </div>
                        <!-- Number of Images: Total snapshots to capture -->
                        <div class="form-group">
                            <label for="num_images">Images:</label>
                            <input type="number" id="num_images" name="num_images" value="10" min="1" class="form-control form-control-sm">
                        </div>
                    </div>
                    <p id="timelapse-status" class="text-muted"></p>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="snapshot-modal" tabindex="-1" aria-labelledby="snapshotModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="snapshotModalLabel">Snapshot Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img id="snapshot-preview" src="" alt="Snapshot Preview">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
